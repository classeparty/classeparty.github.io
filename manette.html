<head>

<style>
*,*::before,*::after{box-sizing:border-box}
:root{--ink:#3a1d0e;--ink-2:#6b3a1c;--crumb:#fff4d6;--white:#fffdf7;--crust:#f39a26;--sun1:#ffd86e;--sun2:#ffb13b;--go:#4cc94c;--q:#3fa9f5;--v:#9b5de5;--a:#22b8a7;--m:#ff5fa2;--c:#ffc82e;--x:#ef3e36;--muted:#8a6a52;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;--f-body:"Baloo 2","Trebuchet MS","Segoe UI",sans-serif;color-scheme:light}
html,body{height:100%;margin:0}
body{background:repeating-conic-gradient(from 0deg at 50% 30%,var(--sun1) 0deg 9deg,var(--sun2) 9deg 18deg) fixed;color:var(--ink);font-family:var(--f-body);font-size:17px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.app{min-height:100%;display:flex;flex-direction:column;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));max-width:560px;margin-inline:auto}
.outline{color:var(--white);-webkit-text-stroke:.14em var(--ink);paint-order:stroke fill;text-shadow:0 .08em 0 var(--ink)}
.top{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-size:1.5rem;margin-right:auto;line-height:1}
.panel{background:var(--crumb);border:4px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink-2);padding:16px;display:grid;gap:12px}
h1,h2{margin:0;font-family:var(--f-display);font-weight:400;line-height:1.05}
h1{font-size:2rem}h2{font-size:1.5rem}
p{margin:0;font-weight:600;line-height:1.35}
.muted{color:var(--muted)}
.btn{--bc:var(--crust);font-family:var(--f-display);font-size:1.2rem;letter-spacing:.02em;line-height:1.1;color:var(--white);text-shadow:0 2px 0 rgba(58,29,14,.55);background:linear-gradient(180deg,rgba(255,255,255,.45) 0 44%,rgba(255,255,255,0) 45%),var(--bc);border:4px solid var(--ink);border-radius:18px;padding:.6em 1em;box-shadow:0 6px 0 var(--ink);cursor:pointer;width:100%;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn[disabled]{filter:grayscale(.6);opacity:.7}
.btn.go{--bc:var(--go)}.btn.violet{--bc:var(--v)}.btn.grey{--bc:#8d8478}.btn.blue{--bc:var(--q)}
.btn.small{font-size:.95rem;padding:.35em .8em;border-width:3px;border-radius:12px;box-shadow:0 4px 0 var(--ink);width:auto}
.btn.huge{font-size:2rem;padding:1em .6em;border-radius:26px;animation:pulse .8s ease-in-out infinite alternate}
.in{width:100%;font:inherit;font-family:var(--f-display);font-size:2.4rem;letter-spacing:.2em;text-align:center;color:var(--ink);background:var(--white);border:4px solid var(--ink);border-radius:16px;padding:6px}
.err{color:var(--x);font-weight:800}
.names{display:grid;gap:8px}
.name{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;font-weight:800;font-size:1.15rem;color:var(--ink);background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.name small{margin-left:auto;font-weight:700;color:var(--muted);font-size:.8rem}
.dot{flex:none;width:24px;height:24px;border-radius:50%;border:3px solid var(--ink);background:radial-gradient(circle at 33% 28%,rgba(255,255,255,.85) 0 18%,rgba(255,255,255,0) 19%),var(--pc,var(--crust))}
.me{display:flex;align-items:center;gap:10px;background:var(--white);border:3px solid var(--ink);border-radius:999px;padding:4px 12px 4px 6px;font-weight:800}
.me b{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.me span{color:var(--ink-2);font-size:.9rem}
.qtext{font-size:1.25rem;font-weight:800;line-height:1.2}
.answers{display:grid;gap:12px}
.answers.two{grid-template-columns:1fr 1fr}
.ans{--bc:var(--q);display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-weight:800;font-size:1.15rem;line-height:1.15;color:#fff;text-shadow:0 2px 0 rgba(58,29,14,.6);background:linear-gradient(180deg,rgba(255,255,255,.35) 0 44%,rgba(255,255,255,0) 45%),var(--bc);border:4px solid var(--ink);border-radius:18px;padding:16px 14px;box-shadow:0 6px 0 var(--ink);cursor:pointer;min-height:68px;touch-action:manipulation}
.ans:active{transform:translateY(3px);box-shadow:0 3px 0 var(--ink)}
.ans .tag{flex:none;display:grid;place-items:center;width:1.9em;height:1.9em;border-radius:10px;background:#fff;color:var(--ink);text-shadow:none;border:3px solid var(--ink);font-family:var(--f-display);font-weight:400}
.ans span:last-child{min-width:0;overflow-wrap:anywhere}
.a0{--bc:#e8413b}.a1{--bc:#2f8fe0}.a2{--bc:#e8a412}.a3{--bc:#3aa83a}
.ans.vrai{--bc:var(--go);justify-content:center;font-family:var(--f-display);font-weight:400;font-size:1.9rem;min-height:120px}
.ans.faux{--bc:var(--x);justify-content:center;font-family:var(--f-display);font-weight:400;font-size:1.9rem;min-height:120px}
.big{font-family:var(--f-display);font-size:2rem;text-align:center;line-height:1.1}
.ok{color:var(--go);-webkit-text-stroke:.06em var(--ink);paint-order:stroke fill}
.ko{color:var(--x);-webkit-text-stroke:.06em var(--ink);paint-order:stroke fill}
.center{text-align:center}
.emoji{font-size:3.4rem;text-align:center;line-height:1}
.foot{margin-top:auto;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:.8rem;font-weight:700;color:var(--ink)}
.foot button{font:inherit;background:none;border:0;text-decoration:underline;color:var(--ink);cursor:pointer;padding:4px}
.status{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--go);border:2px solid var(--ink);margin-right:4px;vertical-align:middle}
.status.off{background:var(--x)}
@keyframes pulse{to{transform:scale(1.03)}}
.big-av{width:150px;height:150px;justify-self:center;animation:avHop 1.6s ease-in-out infinite}
.big-av svg,.mini-av svg,.me-av svg{display:block;width:100%;height:100%}
.me-av{width:30px;height:30px;flex:none}
@keyframes avHop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.av-styles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.av-chip{font:inherit;font-weight:800;font-size:.85rem;background:var(--white);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:4px 10px;box-shadow:0 3px 0 var(--ink);cursor:pointer}
.av-chip.dice{background:#fff1b8}
.av-cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.av-cat{flex:none;font:inherit;font-weight:800;font-size:.8rem;background:var(--white);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:4px 8px;cursor:pointer}
.av-cat.on{background:var(--ink);color:var(--white)}
.av-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.av-opts.colors{grid-template-columns:repeat(6,minmax(0,1fr))}
.av-opt{display:grid;justify-items:center;gap:2px;font:inherit;font-weight:700;font-size:.72rem;color:var(--ink);background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:4px;cursor:pointer;min-height:44px}
.av-opt.on{border-color:var(--v);box-shadow:0 0 0 3px var(--v)}
.av-opts.colors .av-opt{aspect-ratio:1;border-radius:50%}
.mini-av{width:64px;height:64px}
@media (prefers-reduced-motion: reduce){.big-av{animation:none}}
.shop{display:grid;gap:10px}
.item{display:grid;gap:6px;background:var(--white);border:3px solid var(--ink);border-radius:16px;padding:10px 12px;box-shadow:0 4px 0 var(--ink)}
.item.picking{border-color:var(--x);box-shadow:0 4px 0 var(--x)}
.item-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.item-top b{font-family:var(--f-display);font-weight:400;font-size:1.25rem}
.small{font-size:.92rem}
.coin{font-family:var(--f-display);font-size:1.15rem;white-space:nowrap}
.purse{font-weight:800;background:var(--white);border:3px solid var(--ink);border-radius:999px;padding:2px 12px}
.why{font-weight:800;color:var(--muted);text-align:center;background:#eee;border-radius:10px;padding:6px}
.item .btn{padding:.45em .8em}
.word{font-family:var(--f-display);font-size:2.6rem;line-height:1.05;text-align:center;background:var(--white);border:4px solid var(--ink);border-radius:18px;padding:22px 12px;overflow-wrap:anywhere;box-shadow:0 6px 0 var(--m)}
.hold{margin:0;font-weight:800;text-align:center;color:#fff;background:var(--x);border:3px solid var(--ink);border-radius:12px;padding:6px 10px}
.chrono{font-family:var(--f-display);font-size:2.4rem;text-align:center}
@media (prefers-reduced-motion: reduce){.btn.huge{animation:none}}
body.hw{--ink:#22102e;--ink-2:#4a2a63;--sun1:#3b2468;--sun2:#24133f;--crust:#ff7a1a;--c:#ff9a1f}
body.hw .brand,body.hw header .brand{color:#fff}
body.hw .foot,body.hw .foot button{color:#f3e9ff}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand outline">Classe Party</div><div id="meBox"></div></div>
  <main id="main" class="panel" aria-live="polite"></main>
  <div class="foot"><span><span class="status off" id="net"></span><span id="netTxt">Hors ligne</span></span><span id="footBtns"></span></div>
</div>
<script src="lib/supabase.js"></script>
<script src="config.js"></script>
<script src="avatar.js?v=20261011g"></script>
<script>
(function () {
  'use strict';
  const CFG = window.CP_CONFIG || {};
  const main = document.getElementById('main');
  const $ = s => document.querySelector(s);
  function el(tag, props, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') e.className = v; else if (k === 'style') e.style.cssText = v;
      else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, ''); else e.setAttribute(k, v);
    }
    kids.flat(Infinity).forEach(c => { if (c === null || c === undefined || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
    return e;
  }
  const ss = {get(k) { try { return JSON.parse(sessionStorage.getItem('cpm-' + k)); } catch (e) { return null; } }, set(k, v) { try { sessionStorage.setItem('cpm-' + k, JSON.stringify(v)); } catch (e) {} }, del(k) { try { sessionStorage.removeItem('cpm-' + k); } catch (e) {} }};
  const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  if (!window.supabase || !CFG.SUPABASE_URL) { main.replaceChildren(el('h2', {}, 'Manette indisponible'), el('p', {}, 'Le site n\'est pas encore relié à son serveur.')); return; }
  const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {auth: {persistSession: false, autoRefreshToken: false}});
  const devId = ss.get('dev') || ('m' + Math.random().toString(36).slice(2, 10)); ss.set('dev', devId);
  /* compteur « en ce moment » : signale seulement qu'une tablette est ouverte */
  try { const pc = sb.channel('cp-site', {config: {presence: {key: devId}}}); pc.subscribe(st => { if (st === 'SUBSCRIBED') { try { pc.track({p: 'manette'}); } catch (e) {} } }); } catch (e) {}
  try { sb.rpc('compter_visite', {p_page: 'manette', p_nouvelle: true}).then(() => {}, () => {}); } catch (e) {}

  let ch = null, code = '', S = null, pid = -1, answered = null, lastQ = '', helloT = null, foundT = null, lastSig = '', lastBuzz = '', lastSeen = 0, lostShown = false, shopPick = -1, chronoAt = 0, refuseArm = false, holdKey = '', holdAt = 0;

  /* ---------- 1. code ---------- */
  function codeScreen(msg) {
    const inp = el('input', {class: 'in', inputmode: 'numeric', maxlength: '5', autocomplete: 'off', placeholder: '•••••', 'aria-label': 'Code de la partie'});
    inp.value = code || '';
    const go = () => { const c = inp.value.replace(/\D/g, ''); if (c.length !== 5) { err.textContent = 'Le code a 5 chiffres.'; return; } join(c); };
    const err = el('p', {class: 'err'}, msg || '');
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    main.replaceChildren(el('h1', {class: 'outline'}, 'Rejoindre'), el('p', {}, 'Tape le code affiché au tableau.'), inp, err, el('button', {type: 'button', class: 'btn go', onclick: go}, 'REJOINDRE'));
    $('#meBox').replaceChildren(); $('#footBtns').replaceChildren();
    setTimeout(() => { try { inp.focus(); } catch (e) {} }, 100);
  }

  /* ---------- 2. connexion ---------- */
  function join(c) {
    leave(); code = c; ss.set('code', c);
    main.replaceChildren(el('h2', {}, 'Connexion…'), el('p', {class: 'muted'}, 'On cherche la partie ' + c + '.'));
    ch = sb.channel('cp-' + c, {config: {broadcast: {self: false}, presence: {key: devId}}});
    ch.on('broadcast', {event: 'state'}, ({payload}) => onState(payload))
      .subscribe(status => {
        if (status === 'SUBSCRIBED') {
          net(true); track(); hello();
          clearTimeout(foundT); foundT = setTimeout(() => { if (!S) { leave(); ss.del('code'); codeScreen('Partie introuvable. Vérifie le code, ou demande au prof d\'activer les manettes.'); } }, 6000);
        } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') net(false);
      });
  }
  function leave() { if (ch) { try { sb.removeChannel(ch); } catch (e) {} } ch = null; S = null; lastSig = ''; clearInterval(helloT); }
  function hello() { send('hello', {dev: devId}); clearInterval(helloT); helloT = setInterval(() => { if (!S) send('hello', {dev: devId}); }, 2000); }
  function send(ev, payload) { if (!ch) return; try { ch.send({type: 'broadcast', event: ev, payload}); } catch (e) {} }
  function track() { if (!ch) return; try { ch.track({pid, at: Date.now()}); } catch (e) {} }
  function act(a, extra) { vib(30); send('act', Object.assign({dev: devId, pid, a}, extra || {})); }
  function net(on) { $('#net').className = 'status' + (on ? '' : ' off'); $('#netTxt').textContent = on ? 'Connecté · partie ' + code : 'Connexion perdue…'; }

  /* ---------- 3. état reçu du tableau ---------- */
  function onState(st) {
    if (!st || !Array.isArray(st.players)) return;
    lastSeen = Date.now(); if (lostShown) { lostShown = false; lastSig = ''; }
    const sig = JSON.stringify(Object.assign({}, st, {seq: 0}));
    if (sig === lastSig) return;
    lastSig = sig;
    const first = !S; S = st;
    if (first) { const saved = ss.get('pid'); if (saved !== null && saved >= 0 && saved < st.players.length && ss.get('code') === code) { pid = saved; track(); } }
    if (pid >= st.players.length) pid = -1;
    /* la tablette suit le PRÉNOM choisi : si la liste change (ordre, nouvelle partie), on retrouve sa place */
    const myName = ss.get('pname');
    if (pid >= 0 && myName && (!st.players[pid] || st.players[pid].name !== myName)) {
      const k = st.players.findIndex(p => p.name === myName);
      pid = k; ss.set('pid', k); answered = null; track();
    } else if (pid >= 0 && !myName && st.players[pid]) ss.set('pname', st.players[pid].name);
    render();
  }
  function choose(i) { pid = i; ss.set('pid', i); ss.set('pname', S && S.players[i] ? S.players[i].name : null); answered = null; track(); vib(40); render(); }
  function rerender() { render(); }

  function render() {
    document.body.classList.toggle('hw', !!(S && S.theme === 'halloween'));
    if (!S) return;
    $('#footBtns').replaceChildren(el('button', {type: 'button', onclick: () => { pid = -1; ss.del('pid'); ss.del('pname'); track(); render(); }}, 'Changer de joueur'), el('button', {type: 'button', onclick: () => { leave(); ss.del('code'); ss.del('pid'); ss.del('pname'); pid = -1; code = ''; codeScreen(); }}, 'Quitter'));
    if (pid < 0) return pickScreen();
    const me = S.players[pid];
    syncAvatar(me);
    $('#meBox').replaceChildren(el('div', {class: 'me'}, (me.av && window.CPAvatar) ? avEl(me.av, 'me-av') : el('span', {class: 'dot', style: '--pc:' + me.color}), el('b', {}, me.name), (S.playing && S.shop && me.coins !== null) ? el('span', {}, '🪙 ' + me.coins) : null, (S.playing && me.tours !== null) ? el('span', {}, '· ' + me.tours + ' tour' + (me.tours > 1 ? 's' : '')) : null));
    if (!S.playing && S.avatars && window.CPAvatar && (avEditing || !me.av)) return avatarScreen(me);
    if (!S.playing) return show(me.av && window.CPAvatar ? avEl(me.av, 'big-av') : el('div', {class: 'emoji'}, '⏳'), el('h2', {class: 'center'}, 'Tu es prêt !'), el('p', {class: 'center'}, 'La partie va bientôt commencer. Regarde le tableau.'),
      (S.avatars && window.CPAvatar) ? el('button', {type: 'button', class: 'btn small grey', style: 'justify-self:center', onclick: () => { avEditing = true; avDraft = Object.assign({}, me.av || {}); render(); }}, '✏️ Modifier mon avatar') : null);
    if (S.over) return show(el('div', {class: 'emoji'}, '🏆'), el('h2', {class: 'center'}, 'Partie terminée !'), el('p', {class: 'center'}, 'Regarde le tableau pour les étoiles bonus et le podium.'));
    const myTurn = S.turn === pid; const who = S.players[S.turn] || {};
    const card = S.card;
    if (card && card.type === 'q') return questionScreen(card, myTurn, who);
    if (!card || card.type !== 'shop') shopPick = -1;
    if (!card || card.type !== 'mime') { chronoAt = 0; refuseArm = false; }
    if (card && card.type === 'shop') return myTurn ? shopScreen(card.shop) : show(el('div', {class: 'emoji'}, '🛒'), el('h2', {class: 'center'}, (who.name || '…') + ' fait ses achats'), el('p', {class: 'center'}, 'Regarde le tableau.'));
    if (card && card.type === 'mime') return mimeScreen(card.mime, who);
    answered = null; lastQ = '';
    if (S.paused) return show(el('div', {class: 'emoji'}, '⏸️'), el('h2', {class: 'center'}, 'Pause'), el('p', {class: 'center'}, 'Le jeu est en pause.'));
    if (myTurn && !card && S.phase === 'roll') { const bz = 'roll' + S.turn + '|' + JSON.stringify(S.players[pid]); if (bz !== lastBuzz) { lastBuzz = bz; vib([60, 60, 60]); } return show(el('h2', {class: 'center'}, 'C\'est ton tour !'), el('button', {type: 'button', class: 'btn go huge', onclick: e => { e.currentTarget.disabled = true; act('roll'); }}, '🎲 LANCE LES DÉS !')); }
    if (myTurn && card) { const bl = card.btns && card.btns.length ? card.btns : (card.btn ? [card.btn] : []);
      return show(el('h2', {class: 'center'}, card.title || 'À toi !'), el('p', {class: 'center'}, 'Regarde le tableau.'),
        bl.length ? el('div', {style: 'display:grid;gap:10px'}, bl.map((l, i) => el('button', {type: 'button', class: 'btn ' + (i === bl.length - 1 ? 'violet' : 'blue'), onclick: e => { e.currentTarget.disabled = true; act('cont', {i}); }}, l))) : el('p', {class: 'center muted'}, 'Le prof va valider.')); }
    if (myTurn) return show(el('div', {class: 'emoji'}, '🎲'), el('h2', {class: 'center'}, 'C\'est ton tour !'), el('p', {class: 'center'}, 'Regarde ton pion avancer au tableau.'));
    return show(el('div', {class: 'emoji'}, '👀'), el('h2', {class: 'center'}, 'Tour de ' + (who.name || '…')), el('p', {class: 'center'}, card ? (card.title || '') + ' Regarde le tableau.' : 'Regarde le tableau.'));
  }
  /* ---------- avatar (version test 1.11) ---------- */
  let avEditing = false, avDraft = null, avCat = 'perso', avSentKey = '';
  const avKey = () => 'av-' + code + '-' + pid;
  function avEl(av, cls) { const d = el('div', {class: cls || ''}); d.innerHTML = CPAvatar.svg(av); return d; }
  function syncAvatar(me) {
    if (!S.avatars || !window.CPAvatar) return;
    const saved = ss.get(avKey());
    if (!me.av && saved && avSentKey !== JSON.stringify(saved) + S.seq) { avSentKey = JSON.stringify(saved) + S.seq; send('act', {dev: devId, pid, a: 'avatar', av: saved}); }
  }
  function avatarScreen(me) {
    const A = CPAvatar; if (!avDraft) avDraft = Object.assign({}, A.STYLES.animal.a);
    const prev = avEl(avDraft, 'big-av');
    const styles = el('div', {class: 'av-styles'}, Object.values(A.STYLES).map(st => el('button', {type: 'button', class: 'av-chip', onclick: () => { avDraft = Object.assign({}, st.a); vib(15); render(); }}, st.nom)),
      el('button', {type: 'button', class: 'av-chip dice', onclick: () => { avDraft = A.random(); vib(15); render(); }}, '🎲 Au hasard'));
    const cats = A.cats ? A.cats(avDraft) : ['cheveux', 'cheveuxCouleur', 'peau', 'tete', 'oreilles', 'yeux', 'bouche', 'dessus', 'visage', 'dos', 'teinte'];
    if (!cats.includes(avCat)) avCat = cats[0];
    const catRow = el('div', {class: 'av-cats'}, cats.map(c => el('button', {type: 'button', class: 'av-cat' + (c === avCat ? ' on' : ''), onclick: () => { avCat = c; render(); }}, A.LABELS[c])));
    const isColor = avCat === 'peau' || avCat === 'teinte' || avCat === 'cheveuxCouleur';
    const opts = el('div', {class: 'av-opts' + (isColor ? ' colors' : '')}, A.OPT[avCat].map(v => {
      const on = A.clean(avDraft)[avCat] === v;
      const b = el('button', {type: 'button', class: 'av-opt' + (on ? ' on' : ''), 'aria-label': A.LABELS[v] || v, onclick: () => { avDraft[avCat] = v; vib(10); render(); }});
      if (isColor) { b.style.background = v === 'naturel' && A.mainColor ? A.mainColor(Object.assign({}, avDraft, {peau: 'naturel'})) : v; if (v === 'naturel') b.textContent = '★'; }
      else { b.append(avEl(Object.assign({}, avDraft, {[avCat]: v}), 'mini-av'), el('span', {}, A.LABELS[v] || v)); }
      return b;
    }));
    const ok = el('button', {type: 'button', class: 'btn go', onclick: () => { const av = A.clean(avDraft); ss.set(avKey(), av); avEditing = false; avSentKey = ''; send('act', {dev: devId, pid, a: 'avatar', av}); vib([30, 30, 60]); render(); }}, '✅ C\'est moi !');
    show(el('h2', {class: 'center'}, 'Crée ton avatar !'), el('p', {class: 'center muted small'}, 'En attendant les autres joueurs. On le verra sur le plateau et sur le podium !'), prev, styles, catRow, opts, ok);
  }
  function show(...kids) { main.replaceChildren(...kids.filter(k => k !== null && k !== undefined && k !== false)); }

  /* ---------- boutique ---------- */
  function shopScreen(shop) {
    if (!shop) return show(el('h2', {}, 'Boutique'), el('p', {}, 'Regarde le tableau.'));
    const coin = n => el('span', {class: 'coin'}, '🪙 ' + n);
    const list = el('div', {class: 'shop'});
    shop.items.forEach(it => {
      const box = el('div', {class: 'item' + (shopPick === it.i ? ' picking' : '')},
        el('div', {class: 'item-top'}, el('b', {}, it.name), coin(it.price)),
        el('p', {class: 'small'}, it.desc));
      if (it.why) box.append(el('p', {class: 'why'}, it.why));
      else if (!it.target) box.append(el('button', {type: 'button', class: 'btn go', onclick: e => { e.currentTarget.disabled = true; act('buy', {i: it.i}); }}, 'ACHETER'));
      else if (shopPick !== it.i) box.append(el('button', {type: 'button', class: 'btn go', onclick: () => { shopPick = it.i; vib(20); render(); }}, 'ACHETER'));
      else box.append(el('p', {class: 'small'}, el('b', {}, it.i === 1 ? 'À qui veux-tu voler un tour ?' : 'Qui veux-tu coller ?')),
        el('div', {class: 'names'}, it.targets.map(t => el('button', {type: 'button', class: 'name', onclick: e => { e.currentTarget.disabled = true; shopPick = -1; act('buy', {i: it.i, t: t.pid}); }},
          el('span', {class: 'dot', style: '--pc:' + t.color}), t.name, t.joker ? ' 🛡️' : '', el('small', {}, t.tours + ' tour' + (t.tours > 1 ? 's' : ''))))),
        el('button', {type: 'button', class: 'btn small grey', onclick: () => { shopPick = -1; render(); }}, 'Annuler'));
      list.append(box);
    });
    show(el('div', {class: 'item-top'}, el('h2', {}, '🛒 Boutique'), el('span', {class: 'purse'}, 'Ta bourse : ', coin(shop.coins))),
      list, el('button', {type: 'button', class: 'btn violet', onclick: e => { e.currentTarget.disabled = true; act('shopdone'); }}, 'TERMINER LES ACHATS'));
  }

  /* ---------- mime ---------- */
  function mimeScreen(mime, who) {
    const mine = mime && mime.pid === pid;
    if (!mine) { return show(el('div', {class: 'emoji'}, '🎭'), el('h2', {class: 'center'}, (who.name || '…') + ' mime !'), el('p', {class: 'center'}, 'Devine le mot et dis-le à voix haute 🗣️')); }
    if (mime.chrono && !chronoAt) chronoAt = Date.now();
    const kids = [el('p', {class: 'center muted'}, '🤫 Ne montre ton écran à personne !'), el('div', {class: 'word'}, mime.word), el('p', {class: 'center'}, 'Mime ce mot sans parler. Les autres doivent deviner !')];
    if (!mime.chrono) kids.push(el('button', {type: 'button', class: 'btn blue', onclick: e => { e.currentTarget.disabled = true; act('chrono'); }}, '⏱️ Lancer le chrono (1 minute)'));
    else kids.push(el('div', {class: 'chrono', id: 'chrono'}, '⏱️'));
    kids.push(el('button', {type: 'button', class: 'btn small grey', style: 'justify-self:center;margin-top:8px', onclick: e => { if (!refuseArm) { refuseArm = true; e.currentTarget.textContent = 'Sûr ? Touche encore (tu recules d\'une case)'; return; } e.currentTarget.disabled = true; act('mimerefuse'); }}, 'Je préfère ne pas mimer'));
    show(...kids); tickChrono();
  }
  function tickChrono() {
    const c = document.getElementById('chrono'); if (!c || !chronoAt) return;
    const left = Math.max(0, 60 - Math.floor((Date.now() - chronoAt) / 1000));
    c.textContent = left ? '⏱️ 0:' + String(left).padStart(2, '0') : '⏱️ Temps écoulé !';
  }
  setInterval(tickChrono, 500);
  function tickHold() {
    const b = document.getElementById('holdBanner'); if (!b || !holdAt) return;
    const left = Math.max(0, Math.ceil((holdAt - Date.now()) / 1000));
    const who = S && S.players[S.turn] ? S.players[S.turn].name : '';
    b.textContent = left ? `⏳ ${who} a répondu ! Plus que ${left} s pour répondre` : '⏳ C\'est l\'heure de la correction !';
  }
  setInterval(tickHold, 250);

  function pickScreen() {
    $('#meBox').replaceChildren();
    show(el('h2', {}, 'Qui es-tu ?'), el('p', {class: 'muted'}, 'Touche ton prénom ou le nom de ton équipe.'),
      el('div', {class: 'names'}, S.players.map((p, i) => el('button', {type: 'button', class: 'name', onclick: () => choose(i)}, el('span', {class: 'dot', style: '--pc:' + p.color}), p.name))));
  }

  function questionScreen(card, myTurn, who) {
    const q = card.q || {}; const key = (q.text || '') + '|' + S.turn;
    if (key !== lastQ) { lastQ = key; answered = null; if (myTurn || q.all) vib(50); }
    const canAnswer = myTurn || q.all;
    const head = el('p', {class: 'muted'}, myTurn ? 'C\'est ta question !' : (q.all ? 'Tout le monde répond ! Question de ' + (who.name || '') : 'Question de ' + (who.name || '')));
    if (q.revealed) {
      const mine = answered;
      const right = q.right;
      const ok = mine !== null && mine === right;
      const rightTxt = q.vf ? (q.opts[right] || '') : ['A', 'B', 'C', 'D'][right] + '. ' + (q.opts[right] || '');
      const kids = [head, el('p', {class: 'qtext'}, q.text)];
      if (mine === null) kids.push(el('p', {class: 'big'}, '⏱️'), el('p', {class: 'center'}, 'Tu n\'as pas répondu.'));
      else { kids.push(el('p', {class: 'big ' + (ok ? 'ok' : 'ko')}, ok ? 'BONNE RÉPONSE !' : 'RATÉ…')); if (ok && !myTurn && S.shop) kids.push(el('p', {class: 'center'}, '+1 pièce 🪙')); if (lastBuzz !== 'rev' + key) { lastBuzz = 'rev' + key; vib(ok ? [40, 40, 120] : 200); } }
      if (!ok) kids.push(el('p', {class: 'center'}, 'La bonne réponse : ', el('b', {}, rightTxt)));
      if (myTurn && card.cont) kids.push(el('button', {type: 'button', class: 'btn go', onclick: e => { e.currentTarget.disabled = true; act('cont'); }}, 'CONTINUER'));
      return show(...kids);
    }
    if (!canAnswer) return show(head, el('p', {class: 'qtext'}, q.text), el('p', {class: 'center'}, '👀 Regarde le tableau.'));
    if (answered !== null) return show(head, el('p', {class: 'qtext'}, q.text), el('div', {class: 'emoji'}, '✅'), el('p', {class: 'center'}, 'Réponse envoyée : ', el('b', {}, q.vf ? q.opts[answered] : ['A', 'B', 'C', 'D'][answered])), el('p', {class: 'center muted'}, 'Attends la correction au tableau.'));
    const pick = j => { answered = j; act('ans', {j}); render(); };
    const box = el('div', {class: 'answers' + (q.vf ? ' two' : '')});
    if (q.vf) {
      (q.opts || []).forEach((o, j) => box.append(el('button', {type: 'button', class: 'ans ' + (/vrai/i.test(o) ? 'vrai' : 'faux'), onclick: () => pick(j)}, o.toUpperCase())));
    } else {
      (q.opts || []).forEach((o, j) => box.append(el('button', {type: 'button', class: 'ans a' + j, onclick: () => pick(j)}, el('span', {class: 'tag'}, ['A', 'B', 'C', 'D'][j]), el('span', {}, o))));
    }
    if (q.hold && !myTurn) {
      if (holdKey !== key) { holdKey = key; holdAt = Date.now() + q.hold * 1000; vib([30, 30, 30]); }
      show(el('p', {class: 'hold', id: 'holdBanner'}, '⏳'), head, el('p', {class: 'qtext'}, q.text), box); tickHold();
    } else show(head, el('p', {class: 'qtext'}, q.text), box,
      (myTurn && card.exit) ? el('button', {type: 'button', class: 'btn violet', onclick: e => { e.currentTarget.disabled = true; act('useexit'); }}, '🎟️ Je ne sais pas : carte Sortie de retenue') : null);
  }

  setInterval(() => {
    if (!S || !ch || lostShown) return;
    if (Date.now() - lastSeen > 25000) {
      lostShown = true;
      show(el('div', {class: 'emoji'}, '📡'), el('h2', {class: 'center'}, 'Plus de nouvelles du tableau'), el('p', {class: 'center'}, 'Le prof a peut-être fermé ou relancé la partie. Attends un instant, ou entre le nouveau code.'),
        el('button', {type: 'button', class: 'btn violet', onclick: () => { leave(); ss.del('code'); ss.del('pid'); ss.del('pname'); pid = -1; code = ''; codeScreen(); }}, 'Entrer un nouveau code'));
    }
  }, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && ch && code) { send('hello', {dev: devId}); track(); } });

  const urlCode = (new URLSearchParams(location.search).get('code') || '').replace(/\D/g, '');
  const savedCode = ss.get('code');
  if (urlCode.length === 5) join(urlCode);
  else if (savedCode) join(savedCode);
  else codeScreen();
})();
</script>
</body>
</html>
