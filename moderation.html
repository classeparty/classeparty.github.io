<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modération · Classe Party</title>
<meta name="description" content="Espace de modération réservé aux administrateurs de Classe Party.">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css?v=20261011e">
</head>
<body>
<header id="site-head"></header>
<main class="wrap" id="main">
<div class="stack" id="zone"></div>
</main>
<footer id="site-foot"></footer>
<script src="lib/supabase.js"></script>
<script src="config.js"></script>
<script src="format.js"></script>
<script src="exemples.js"></script>
<script src="app.js?v=20261011e"></script>
<script>
(async () => {
  await CP.init('moderation.html');
  const {el, $} = CP; const zone = $('#zone');
  if (!CP.online || !CP.user){ CP.needLogin(zone, 'accéder à la modération'); return; }
  if (!CP.isAdmin()){ zone.replaceChildren(el('div', {class: 'panel empty'}, el('h2', {}, 'Espace réservé'), el('p', {}, 'Cette page est réservée aux administrateurs du site.'))); return; }
  const TYPES = {cours: 'Cours', sujet: 'Sujet du forum', message: 'Message du forum'};
  const TABLE = {cours: 'courses', sujet: 'forum_topics', message: 'forum_posts'};
  const showDone = el('input', {type: 'checkbox'});
  const list = el('div', {class: 'stack', style: 'gap:10px'});
  /* --- compteur « en ce moment » --- */
  const LABELS = {index: 'Accueil', bibliotheque: 'Bibliothèque', forum: 'Forum', 'mes-cours': 'Mes cours', tuto: 'Tuto', connexion: 'Connexion', nouveautes: 'Nouveautés', 'qui-sommes-nous': 'Qui sommes-nous', 'astuce-ia': 'Astuce IA', moderation: 'Modération (toi)', deontologie: 'Charte', confidentialite: 'Confidentialité', licence: 'Licence'};
  const tile = (ico, n, label) => el('div', {class: 'live-tile'}, el('span', {class: 'live-ico'}, ico), el('b', {}, String(n)), el('span', {}, label));
  const liveTiles = el('div', {class: 'live-tiles'}), liveList = el('div', {class: 'live-list'}), liveAt = el('p', {class: 'small muted'});
  const live = el('section', {class: 'panel stack'},
    el('h2', {}, '👀 En ce moment sur Classe Party'),
    liveTiles, liveList, liveAt,
    el('p', {class: 'small muted'}, 'Compte les pages ouvertes en direct (une personne avec deux onglets compte deux fois). Rien n\'est enregistré : ni nom, ni adresse, ni cookie.'));
  function renderLive(st) {
    const counts = {}; let site = 0, jeu = 0, tab = 0;
    Object.values(st || {}).forEach(metas => {
      const m = metas && metas[0]; if (!m) return;
      const k = m.p || 'autre';
      if (k === 'jeu') jeu++; else if (k === 'manette') tab++; else { site++; counts[k] = (counts[k] || 0) + 1; }
    });
    liveTiles.replaceChildren(tile('🌐', site, site > 1 ? 'pages du site ouvertes' : 'page du site ouverte'), tile('🎲', jeu, jeu > 1 ? 'jeux ouverts' : 'jeu ouvert'), tile('📱', tab, tab > 1 ? 'tablettes connectées' : 'tablette connectée'));
    liveList.replaceChildren(...Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([k, n]) => el('span', {class: 'chip'}, (LABELS[k] || k) + ' · ' + n)));
    liveAt.textContent = 'Mis à jour à ' + new Date().toLocaleTimeString('fr-BE', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
  }
  CP.onPresence = renderLive;
  renderLive(CP.siteCh ? CP.siteCh.presenceState() : {});

  /* --- historique des visites (statistiques anonymes) --- */
  const RANGES = [['24h', '24 heures', 'hour', 24], ['7j', '7 jours', 'day', 7], ['30j', '30 jours', 'day', 30], ['12m', '12 mois', 'month', 12]];
  const METRICS = [['visites', 'Visites du site', 'visite', 'visites'], ['vues', 'Pages vues', 'page vue', 'pages vues'], ['jeux', 'Parties lancées', 'partie lancée', 'parties lancées'], ['tablettes', 'Tablettes connectées', 'tablette', 'tablettes']];
  let range = '7j', metric = 'visites', rows = [];
  const rangeBtns = el('div', {class: 'tabs', role: 'tablist', 'aria-label': 'Période'});
  const metricTabs = el('div', {class: 'stat-tiles'});
  const chartBox = el('div', {class: 'chart-box'});
  const tableBox = el('details', {class: 'small'});
  const stats = el('section', {class: 'panel stack'},
    el('div', {class: 'btn-row', style: 'justify-content:space-between;align-items:center'}, el('h2', {}, '📈 Historique des visites'), rangeBtns),
    metricTabs, chartBox, tableBox,
    el('p', {class: 'small muted'}, 'Statistiques anonymes : le site compte les pages vues par heure, sans cookie, sans adresse IP et sans rien savoir des visiteurs. Une « visite », c\'est une arrivée sur le site depuis l\'extérieur. Tes propres visites ne sont pas comptées quand tu es connecté. Les chiffres sont gardés 13 mois.'));
  const pad = n => String(n).padStart(2, '0');
  const keyOf = (d, pas) => pas === 'month' ? `${d.getFullYear()}-${pad(d.getMonth() + 1)}` : pas === 'day' ? `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` : `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}`;
  function buckets(pas, n) {
    const now = new Date(); const out = [];
    for (let i = n - 1; i >= 0; i--) {
      const d = new Date(now);
      if (pas === 'hour') { d.setMinutes(0, 0, 0); d.setHours(d.getHours() - i); }
      else if (pas === 'day') { d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i); }
      else { d.setHours(0, 0, 0, 0); d.setDate(1); d.setMonth(d.getMonth() - i); }
      out.push(d);
    }
    return out;
  }
  const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  const JOURS = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
  const label = (d, pas, long) => pas === 'hour' ? (long ? `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}, ${d.getHours()} h – ${d.getHours() + 1} h` : `${d.getHours()} h`)
    : pas === 'day' ? (long ? `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()}` : `${d.getDate()}/${d.getMonth() + 1}`)
    : (long ? `${MOIS[d.getMonth()]} ${d.getFullYear()}` : MOIS[d.getMonth()]);
  function niceScale(v) { const raw = Math.max(v, 4) / 5, p = Math.pow(10, Math.floor(Math.log10(raw))); const step = Math.max(1, [1, 2, 5, 10].map(m => m * p).find(x => x >= raw)); const k = Math.max(Math.ceil(v / step), 4); return {step, k, max: step * k}; }
  function renderStats() {
    const [, rlabel, pas, n] = RANGES.find(r => r[0] === range);
    rangeBtns.replaceChildren(...RANGES.map(([k, l]) => el('button', {type: 'button', class: 'tab', role: 'tab', 'aria-selected': String(k === range), onclick: () => { range = k; loadStats(); }}, l)));
    const bs = buckets(pas, n); const map = new Map(rows.map(r => [keyOf(new Date(String(r.periode).replace(' ', 'T').slice(0, 19)), pas), r]));
    const data = bs.map(d => { const r = map.get(keyOf(d, pas)) || {}; return {d, v: Object.fromEntries(METRICS.map(([m]) => [m, Number(r[m]) || 0]))}; });
    metricTabs.replaceChildren(...METRICS.map(([m, l, one, many]) => { const tot = data.reduce((t, x) => t + x.v[m], 0);
      return el('button', {type: 'button', class: 'stat-tile' + (m === metric ? ' on' : ''), 'aria-pressed': String(m === metric), onclick: () => { metric = m; renderStats(); }}, el('b', {}, tot.toLocaleString('fr-BE')), el('span', {}, l)); }));
    const [, mlabel, one, many] = METRICS.find(x => x[0] === metric);
    const vals = data.map(x => x.v[metric]); const sc = niceScale(Math.max(...vals, 0)), max = sc.max;
    const W = 760, H = 240, L = 40, R = 8, T = 12, B = 30, pw = W - L - R, ph = H - T - B, band = pw / n, bw = Math.min(24, band - 2);
    const ns = 'http://www.w3.org/2000/svg'; const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', `${mlabel} sur ${rlabel}`); svg.classList.add('chart');
    const add = (tag, attrs, txt) => { const e = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (txt !== undefined) e.textContent = txt; svg.append(e); return e; };
    for (let g = 0; g <= sc.k; g++) { const y = T + ph - ph * g / sc.k; add('line', {x1: L, x2: W - R, y1: y, y2: y, class: g ? 'grid' : 'axis'}); add('text', {x: L - 6, y: y + 4, 'text-anchor': 'end', class: 'tick'}, (sc.step * g).toLocaleString('fr-BE')); }
    const every = pas === 'hour' ? 3 : pas === 'month' ? 1 : n > 10 ? 5 : 1;
    const tip = el('div', {class: 'chart-tip', hidden: true});
    data.forEach((x, i) => {
      const v = x.v[metric], cx = L + band * i + band / 2, h = max ? ph * v / max : 0, y = T + ph - h, r = Math.min(4, h, bw / 2), x0 = cx - bw / 2;
      if (v > 0) add('path', {class: 'bar', d: `M${x0},${T + ph} V${y + r} Q${x0},${y} ${x0 + r},${y} H${x0 + bw - r} Q${x0 + bw},${y} ${x0 + bw},${y + r} V${T + ph} Z`});
      if (i % every === 0 || i === n - 1) add('text', {x: cx, y: H - 10, 'text-anchor': 'middle', class: 'tick'}, label(x.d, pas, false));
      const hit = add('rect', {x: L + band * i, y: T, width: band, height: ph, class: 'hit', tabindex: '0', 'aria-label': `${label(x.d, pas, true)} : ${v} ${v > 1 ? many : one}`});
      const show = () => { tip.hidden = false; tip.replaceChildren(el('b', {}, `${v.toLocaleString('fr-BE')} ${v > 1 ? many : one}`), el('span', {}, label(x.d, pas, true)));
        const bx = chartBox.getBoundingClientRect(), sx = bx.width / W; tip.style.left = Math.min(Math.max(cx * sx, 70), bx.width - 70) + 'px'; tip.style.top = Math.max(0, y * sx - 8) + 'px'; hit.classList.add('on'); };
      const hide = () => { tip.hidden = true; hit.classList.remove('on'); };
      hit.addEventListener('mouseenter', show); hit.addEventListener('mouseleave', hide); hit.addEventListener('focus', show); hit.addEventListener('blur', hide);
    });
    const total = vals.reduce((a, b) => a + b, 0);
    chartBox.replaceChildren(el('p', {class: 'chart-title'}, `${mlabel} · ${rlabel}`), svg, tip, total ? null : el('p', {class: 'notice', style: 'margin-top:8px'}, 'Pas encore de visites enregistrées sur cette période.'));
    tableBox.replaceChildren(el('summary', {}, 'Voir les chiffres en tableau'),
      el('div', {class: 'table-scroll'}, el('table', {class: 'stats-table'}, el('thead', {}, el('tr', {}, el('th', {}, 'Période'), ...METRICS.map(m => el('th', {}, m[1])))),
        el('tbody', {}, data.slice().reverse().map(x => el('tr', {}, el('td', {}, label(x.d, pas, true)), ...METRICS.map(([m]) => el('td', {}, x.v[m].toLocaleString('fr-BE')))))))));
  }
  async function loadStats() {
    const [, , pas, n] = RANGES.find(r => r[0] === range);
    const since = buckets(pas, n)[0];
    chartBox.replaceChildren(el('p', {class: 'muted'}, 'Chargement…'));
    const {data, error} = await CP.sb.rpc('stats_resume', {p_depuis: since.toISOString(), p_pas: pas});
    if (error) {
      rangeBtns.replaceChildren(); metricTabs.replaceChildren(); tableBox.replaceChildren();
      chartBox.replaceChildren(el('div', {class: 'notice'}, el('b', {}, 'Le module de statistiques n\'est pas encore installé. '), 'Dans Supabase, ouvre « SQL Editor », colle le contenu du fichier stats-visites.sql et clique sur « Run ». Recharge ensuite cette page.'));
      return;
    }
    rows = data || []; renderStats();
  }
  loadStats();
  zone.replaceChildren(live, stats, el('section', {class: 'panel stack'},
    el('h1', {class: 'outline'}, 'Modération'),
    el('p', {class: 'lead'}, 'Les contenus signalés par les membres. Vérifie chaque signalement, puis supprime le contenu ou marque le signalement comme traité.'),
    el('label', {class: 'check'}, showDone, el('span', {}, 'Afficher aussi les signalements déjà traités')), list),
    el('section', {class: 'panel stack', style: 'border-style:dashed'},
      el('h2', {}, '🛠️ Labo ', el('span', {class: 'chip', style: 'background:#efe6ff'}, 'réservé à l\'administrateur')),
      el('p', {class: 'muted'}, 'Les fonctions en test. Personne d\'autre ne les voit : elles ne sont liées nulle part sur le site et ne s\'activent que pour un compte administrateur.'),
      el('div', {class: 'paper stack', style: 'align-content:start'},
        el('h3', {}, '🧪 Version test 1.11 : cartes spéciales et avatars'),
        el('ul', {style: 'margin:0;padding-left:1.2em;display:grid;gap:4px'},
          el('li', {}, el('b', {}, 'Chance → carte Sortie de retenue 🎟️ : '), 'on la garde, et on l\'utilise en retenue si on ne connaît pas la réponse.'),
          el('li', {}, el('b', {}, 'Chance → carte Joker 🛡️ : '), 'protège une fois contre la glue ou la canne à pêche (l\'objet de l\'adversaire est bloqué).'),
          el('li', {}, el('b', {}, 'Malchance → un dé de moins '), 'au lancer suivant, en plus des pertes de pièces habituelles.'),
          el('li', {}, el('b', {}, 'Avatars 🎭 (avec les tablettes) : '), 'en attendant le début de la partie, chaque élève crée son personnage (animal, monstre, prince, princesse, féerique, super-héros, ou au hasard). On le voit sur son pion, dans le classement et sur le podium animé.')),
        el('p', {class: 'small muted'}, 'Ces cartes s\'ajoutent aux cartes habituelles (environ 2 cartes Chance sur 5 et 1 carte Malchance sur 3). Elles n\'existent que dans ce jeu de test : le jeu normal, le jeu téléchargé et le programme Windows ne changent pas. Un badge « 🧪 TEST 1.11 » s\'affiche en haut du jeu.'),
        el('div', {class: 'btn-row'}, el('a', {class: 'btn violet', href: 'jouer.html?test=1.11', target: '_blank', rel: 'noopener'}, 'Lancer le jeu de test 1.11'), el('a', {class: 'btn small grey', href: 'manette.html', target: '_blank', rel: 'noopener'}, 'Ouvrir une manette')))));
  showDone.addEventListener('change', load);
  async function open(r){
    if (r.cible_type === 'cours'){
      const {data} = await CP.sb.from('courses').select('*').eq('id', r.cible_id).maybeSingle();
      if (!data) return CP.toast('Ce cours n\'existe plus.'); CP.preview(data);
    } else if (r.cible_type === 'sujet'){ window.open('forum.html?sujet=' + r.cible_id, '_blank'); }
    else {
      const {data} = await CP.sb.from('forum_posts').select('topic_id,contenu').eq('id', r.cible_id).maybeSingle();
      if (!data) return CP.toast('Ce message n\'existe plus.');
      CP.modal({title: 'Message signalé', body: [el('div', {class: 'post'}, el('div', {class: 'txt'}, data.contenu))], foot: [el('a', {class: 'btn blue', href: 'forum.html?sujet=' + data.topic_id, target: '_blank'}, 'Voir la discussion')]});
    }
  }
  async function load(){
    list.replaceChildren(el('p', {class: 'muted'}, 'Chargement…'));
    let req = CP.sb.from('reports').select('id,cible_type,cible_id,raison,traite,created_at,profiles!reporter(display_name)').order('created_at', {ascending: false}).limit(200);
    if (!showDone.checked) req = req.eq('traite', false);
    const {data, error} = await req;
    if (error){ list.replaceChildren(el('p', {class: 'notice err'}, 'Impossible de charger les signalements.')); return; }
    if (!data.length){ list.replaceChildren(el('div', {class: 'empty'}, el('p', {class: 'lead'}, 'Aucun signalement en attente. Tout va bien !'))); return; }
    list.replaceChildren(...data.map(r => {
      const del = el('button', {type: 'button', class: 'btn small red'}, 'Supprimer le contenu');
      del.addEventListener('click', async () => {
        if (!del.dataset.armed){ del.dataset.armed = '1'; del.textContent = 'Sûr ? Re-clique'; return; }
        const {error: e1} = await CP.sb.from(TABLE[r.cible_type]).delete().eq('id', r.cible_id);
        if (e1){ CP.toast('Suppression impossible.'); return; }
        await CP.sb.from('reports').update({traite: true}).eq('id', r.id); CP.toast('Contenu supprimé.'); load();
      });
      return el('article', {class: 'card'},
        el('div', {class: 'meta'}, el('span', {class: 'chip m'}, TYPES[r.cible_type]), r.traite ? el('span', {class: 'chip pub'}, 'Traité') : el('span', {class: 'chip'}, 'En attente'), el('span', {class: 'stat'}, `signalé par ${(r.profiles && r.profiles.display_name) || 'un membre'} · ${CP.ago(r.created_at)}`)),
        el('p', {}, el('b', {}, 'Raison : '), r.raison),
        el('div', {class: 'foot'},
          el('button', {type: 'button', class: 'btn small blue', onclick: () => open(r)}, 'Voir le contenu'),
          r.cible_type === 'cours' ? el('button', {type: 'button', class: 'btn small violet', onclick: async () => {
            const {error: e2} = await CP.sb.from('courses').update({public: false}).eq('id', r.cible_id); CP.toast(e2 ? 'Action impossible.' : 'Le cours est retiré de la bibliothèque.'); }}, 'Retirer de la bibliothèque') : null,
          del,
          r.traite ? null : el('button', {type: 'button', class: 'btn small go', onclick: async () => { await CP.sb.from('reports').update({traite: true}).eq('id', r.id); load(); }}, 'Marquer comme traité')));
    }));
  }
  load();
})();

</script>
</body>
</html>
